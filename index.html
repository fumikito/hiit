<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>HIITタイマー</title>
	<meta name="robots" content="noindex">
	<meta name="theme-color" content="#18181b">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="HIIT">
	<link rel="manifest" href="manifest.json">
	<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
	<link rel="apple-touch-icon" href="icons/icon-180.png">
	<link rel="stylesheet" href="style.css">
	<script type="module" src="js/app.js"></script>
</head>
<body data-state="idle">
	<header class="bar">
		<label class="picker">
			<span id="workout-title" class="picker-title">読み込み中…</span>
			<select id="workout-select" aria-label="ワークアウトを選択"></select>
		</label>
		<button id="open-settings" class="icon-btn" type="button" aria-label="設定">
			<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" transform="translate(-1 0)"/></svg>
		</button>
	</header>

	<p id="notice" class="notice" role="alert" hidden></p>

	<main class="stage">
		<p id="phase-label" class="phase-label">スタート待ち</p>
		<p id="counter" class="counter"></p>
		<h1 id="phase-name" class="phase-name"></h1>
		<div id="time" class="time" role="timer" aria-live="off">0</div>
		<div class="phase-track"><div id="phase-bar" class="phase-bar"></div></div>
		<p id="next" class="next"></p>
	</main>

	<footer class="dock">
		<div class="total">
			<div id="segments" class="segments"></div>
			<div id="total-fill" class="segments segments-done"></div>
		</div>
		<div class="total-meta"><span id="elapsed"></span><span id="left"></span></div>
		<div class="controls">
			<button id="reset" class="btn btn-sub" type="button" disabled>リセット</button>
			<button id="toggle" class="btn btn-main" type="button" disabled>スタート</button>
		</div>
	</footer>

	<dialog id="settings" class="settings">
		<form method="dialog">
			<h2>設定</h2>
			<div class="opts">
				<label><input id="opt-sound" type="checkbox"> ビープ音</label>
				<label><input id="opt-voice" type="checkbox"> 種目名の読み上げ</label>
			</div>
			<section class="wk">
				<p class="wk-label">選択中のワークアウト</p>
				<p id="wk-current" class="wk-current"></p>
				<div class="wk-actions">
					<button id="wk-edit" class="btn btn-sub" type="button">編集</button>
					<button id="wk-new" class="btn btn-sub" type="button">＋ 新規作成</button>
				</div>
				<p class="wk-note">作ったワークアウトはこの端末（このブラウザ）にだけ保存されます。</p>
			</section>
			<div class="fetch">
				<button id="refetch" class="btn btn-sub" type="button">プリセットを再取得</button>
				<p id="fetch-status" class="fetch-status" role="status"></p>
			</div>
			<details class="help">
				<summary>プリセットの定義（workouts.json）を見る</summary>
				<pre id="source" class="source"></pre>
			</details>
			<div class="dialog-actions">
				<button id="settings-close" class="btn btn-sub" type="submit">閉じる</button>
			</div>
		</form>
	</dialog>

	<dialog id="editor" class="settings editor">
		<form id="editor-form" novalidate>
			<h2 id="editor-heading">ワークアウトを編集</h2>
			<label class="ed-field ed-wide">
				<span>ワークアウト名</span>
				<input name="ed-name" type="text" required autocomplete="off">
			</label>
			<div class="ed-grid">
				<label class="ed-field"><span>運動（秒）</span><input name="ed-work" type="number" inputmode="numeric" min="1" step="1"></label>
				<label class="ed-field"><span>インターバル（秒）</span><input name="ed-rest" type="number" inputmode="numeric" min="0" step="1"></label>
				<label class="ed-field"><span>カウントダウン（秒）</span><input name="ed-countdown" type="number" inputmode="numeric" min="0" step="1"></label>
				<label class="ed-field"><span>ラウンド数</span><input name="ed-rounds" type="number" inputmode="numeric" min="1" step="1"></label>
				<label class="ed-field"><span>ラウンド間の休憩（秒）</span><input name="ed-roundRest" type="number" inputmode="numeric" min="0" step="1"></label>
			</div>
			<h3 class="ed-sets-heading">種目 <small>秒数が空欄なら上の既定値を使います</small></h3>
			<ol id="ed-sets" class="ed-sets"></ol>
			<button id="ed-add" class="btn btn-sub ed-add" type="button">＋ 種目を追加</button>
			<p id="ed-total" class="ed-total"></p>
			<p id="ed-error" class="editor-error" role="alert"></p>
			<div class="dialog-actions">
				<button id="ed-delete" class="btn btn-danger" type="button" hidden>削除</button>
				<button id="ed-cancel" class="btn btn-sub" type="button">キャンセル</button>
				<button class="btn btn-main" type="submit">保存</button>
			</div>
		</form>
	</dialog>

	<template id="ed-set-row">
		<li class="ed-set">
			<div class="ed-set-head">
				<input class="ed-set-name" type="text" placeholder="種目名" aria-label="種目名" autocomplete="off">
				<span class="ed-set-tools">
					<button type="button" data-act="up" aria-label="上へ">↑</button>
					<button type="button" data-act="down" aria-label="下へ">↓</button>
					<button type="button" data-act="remove" aria-label="削除">×</button>
				</span>
			</div>
			<div class="ed-set-times">
				<label>運動<input class="ed-set-work" type="number" inputmode="numeric" min="1" step="1" aria-label="運動（秒）"></label>
				<label>休憩<input class="ed-set-rest" type="number" inputmode="numeric" min="0" step="1" aria-label="休憩（秒）"></label>
			</div>
		</li>
	</template>
</body>
</html>
